<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WIBUSTREAM V5 - SSS RANK</title>
    
    <meta name="theme-color" content="#050508">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050508;
            --surface: #0f0f17;
            --main: #8162FF;
            --blue-jjk: #00d2ff;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; min-height: 100vh; }

        /* BACKGROUND PARTICLE */
        #particle-container { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: var(--blue-jjk); border-radius: 50%; opacity: 0.3; filter: blur(1px); animation: moveParticle 8s linear infinite; }
        @keyframes moveParticle { 0% { transform: translateY(110vh) scale(0); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

        /* LOGIN SCREEN */
        #loginScreen { position: fixed; inset: 0; background: var(--bg); z-index: 99999; display: flex; align-items: center; justify-content: center; transition: 0.8s ease; }
        .login-card { background: rgba(255,255,255,0.03); padding: 40px 30px; border-radius: 40px; border: 1px solid var(--border); backdrop-filter: blur(20px); text-align: center; width: 85%; }
        .btn-google { background: #fff; color: #000; border: none; padding: 15px 25px; border-radius: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 20px auto; }

        /* HEADER & UI */
        .glass-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(5,5,8,0.8); backdrop-filter: blur(10px); z-index: 100; }
        .pfp { width: 45px; height: 45px; border-radius: 15px; border: 2px solid var(--blue-jjk); object-fit: cover; }

        /* BINGKAI ANIME GELO */
        .grid-anime { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px; padding-bottom: 100px; }
        .anime-card { position: relative; border-radius: 18px; overflow: hidden; background: #101018; padding: 2px; }
        .anime-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, var(--blue-jjk), transparent 30%, var(--main), transparent 70%); animation: rotateFrame 4s linear infinite; }
        .card-inner { position: relative; background: #0d0d12; border-radius: 16px; z-index: 1; overflow: hidden; }
        .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .card-info { padding: 8px; font-size: 10px; text-align: center; }
        @keyframes rotateFrame { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* RATING GLOW */
        .star { color: #333; font-size: 8px; }
        .star.filled { color: #ffcc00; text-shadow: 0 0 5px #ffcc00; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

        /* DOMAIN EXPANSION (LIMIT) */
        .limit-overlay { position: fixed; inset: 0; background: radial-gradient(circle, #001a33 0%, #000 100%); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .energy-bar { width: 70%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .energy-fill { height: 100%; width: 0%; background: var(--blue-jjk); box-shadow: 0 0 15px var(--blue-jjk); transition: 0.5s; }
        .btn-jjk { background: transparent; border: 2px solid var(--blue-jjk); color: var(--blue-jjk); padding: 12px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; }

        /* NAV DOCK */
        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; height: 65px; background: rgba(15,15,23,0.85); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        
        /* RANK STYLE */
        #userRank { transition: 0.3s; }
        @keyframes sssPulse { from { filter: drop-shadow(0 0 2px #ff0000); transform: scale(1); } to { filter: drop-shadow(0 0 12px #ff0000); transform: scale(1.05); } }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <div id="loginScreen">
        <div class="login-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Jujutsu_Kaisen_logo.png/640px-Jujutsu_Kaisen_logo.png" width="100">
            <h3>WIBUSTREAM V5</h3>
            <p style="font-size: 11px; color: #666;">Masuk untuk Memulihkan Energi Kutukan</p>
            <button class="btn-google" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18"> Google Login
            </button>
        </div>
    </div>

    <div id="limitOverlay" class="limit-overlay">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Jujutsu_Kaisen_logo.png/640px-Jujutsu_Kaisen_logo.png" width="120">
        <h2 style="letter-spacing: 3px;">MURYOKUSHO</h2>
        <p style="font-size: 12px; color: #aaa;">Energi Habis, Cok! Tonton iklan buat isi lagi.</p>
        <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
        <button class="btn-jjk" onclick="nontonIklan()">⚡ ISI ENERGI (+1) ⚡</button>
        <p onclick="document.getElementById('limitOverlay').style.display='none'" style="margin-top:20px; font-size:10px; color:#333;">Tutup</p>
    </div>

    <div class="glass-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="uImg" class="pfp" src="">
            <div>
                <div id="uName" style="font-weight:800; font-size:14px;">Wibuers</div>
                <div id="userRank" style="font-size:9px; color:var(--blue-jjk);">F-RANK</div>
            </div>
        </div>
        <div id="uEnergy" style="font-weight:800; color:var(--blue-jjk);">E: 0/50</div>
    </div>

    <div class="grid-anime" id="animeList"></div>

    <div class="nav-dock">
        <div onclick="location.reload()">🏠</div>
        <div onclick="showHistory()">🕒</div>
        <div onclick="showProfile()">👤</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1Zsqjz0xYQahETJEfyz_BYomBhUTetR8",
            authDomain: "wibustream-v1.firebaseapp.com",
            projectId: "wibustream-v1",
            databaseURL: "https://wibustream-v1-default-rtdb.firebaseio.com",
            storageBucket: "wibustream-v1.firebasestorage.app",
            appId: "1:956917540118:web:996a56d1103482ac32dc37"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let energy = 0;
        const ownerEmail = "gamerprobayu@gmail.com";

        // PARTICLE GENERATOR
        const pContainer = document.getElementById('particle-container');
        for(let i=0; i<25; i++) {
            let p = document.createElement('div'); p.className='particle';
            p.style.left = Math.random()*100+'vw'; p.style.width = p.style.height = Math.random()*4+'px';
            p.style.animationDuration = (Math.random()*5+5)+'s'; pContainer.appendChild(p);
        }

        window.login = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginScreen').style.transform = "translateY(-100%)";
                document.getElementById('uName').innerText = user.displayName;
                document.getElementById('uImg').src = user.photoURL;

                if (user.email === ownerEmail) {
                    energy = 99999;
                    const r = document.getElementById('userRank');
                    r.innerText = "SSS-RANK OWNER";
                    r.style.color = "#ff0000";
                    r.style.animation = "sssPulse 1.5s infinite alternate";
                } else {
                    const snap = await get(ref(db, `users/${user.uid}/energy`));
                    energy = snap.exists() ? snap.val() : 5;
                }
                updateUI();
                loadData();
            }
        });

        function loadData() {
            onValue(ref(db, 'content/anime'), (snap) => {
                const list = document.getElementById('animeList');
                list.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val();
                    list.innerHTML += `
                        <div class="anime-card" onclick="watch('${d.judul}')">
                            <div class="card-inner">
                                <img src="${d.poster}">
                                <div class="card-info">
                                    <div style="overflow:hidden; white-space:nowrap;">${d.judul}</div>
                                    <div style="margin-top:4px;"><span class="star filled">★</span><span class="star filled">★</span><span class="star filled">★</span><span class="star filled">★</span><span class="star">★</span></div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        window.watch = (j) => {
            if (energy > 0) {
                if (energy < 1000) energy--;
                updateUI();
                saveEnergy();
                alert("Memutar: " + j);
            } else {
                document.getElementById('limitOverlay').style.display = 'flex';
                new Audio('https://www.myinstants.com/media/sounds/ryoiki-tenkai.mp3').play();
            }
        };

        window.nontonIklan = () => {
            window.open("https://www.highcpmrevenuegate.com/directlink_lu", "_blank");
            setTimeout(() => {
                if(energy < 50) energy++;
                updateUI(); saveEnergy();
                document.getElementById('limitOverlay').style.display = 'none';
            }, 5000);
        };

        function updateUI() {
            document.getElementById('uEnergy').innerText = "E: " + (energy > 1000 ? "∞" : energy + "/50");
            document.getElementById('energyFill').style.width = (energy/50*100) + "%";
        }

        function saveEnergy() {
            if(auth.currentUser && energy < 1000) set(ref(db, `users/${auth.currentUser.uid}/energy`), energy);
        }

        window.showProfile = () => {
            if(auth.currentUser.email === ownerEmail) new Audio('https://www.myinstants.com/media/sounds/sukuna-laugh.mp3').play();
            alert("User: " + auth.currentUser.displayName + "\nRank: " + document.getElementById('userRank').innerText);
        };
        
        window.showHistory = () => alert("History Nonton Masih Kosong, Cok!");

    </script>
</body>
</html>
